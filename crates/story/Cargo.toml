[package]
name = "gpui-component-story"
version = "0.7.1"
publish = false
edition.workspace = true

[features]
gpui-fast = ["gpui-kit/gpui-fast", "gpui-fps/gpui-fast", "gpui-shell/gpui-fast"]
inspector = ["gpui-kit/inspector"]
tree-sitter = ["gpui-kit/tree-sitter-languages"]
test-support = ["gpui-kit/test-support"]
default = ["tree-sitter"]

[dependencies]
anyhow.workspace = true
gpui-kit = { workspace = true, features = ["speech"] }
gpui-fps.workspace = true

async-channel = "2.5.0"
autocorrect = "2.14.2"
chrono = "0.4"
csv = "1.4"
fake = "5.1.0"
itertools = "0.15.0"
rand = "0.10.3"
regex = "1"
serde = "1"
serde_json = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "fmt",
  "registry",
], default-features = false }
unindent = "0.2.4"
rust-i18n.workspace = true
dirs = "7.0.0"

# Native-only dependencies (not available on WASM)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui-shell.workspace = true
reqwest_client.workspace = true
smol.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# WASM has no tree-sitter grammars, so the Editor story highlights with
# `syntect` there. Native uses the built-in tree-sitter highlighter.
syntect.workspace = true
# Browser entropy for `rand` and `fake` on wasm32-unknown-unknown.
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
